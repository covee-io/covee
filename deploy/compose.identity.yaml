# Optional overlay selected only by prepared runtimes with an identity profile.
services:
  headscale:
    environment:
      SSL_CERT_DIR: /run/covee/identity-ca
    volumes:
      - type: bind
        source: ${COVEE_DEPLOY_DIR:?}/identity-trust.pem
        target: /run/covee/identity-ca/identity-trust.pem
        read_only: true
        bind: {create_host_path: false}

  management:
    volumes:
      - type: bind
        source: ${COVEE_DEPLOY_DIR:?}/identity-trust.pem
        target: /run/covee/identity-ca/identity-trust.pem
        read_only: true
        bind: {create_host_path: false}

  ingress:
    environment:
      COVEE_IDENTITY_UPSTREAM: https://identity:8446
      COVEE_INGRESS_CONTROL_LISTEN: ":443"
    # Broker clients use the exact public issuer origin on this private alias.
    # This changes only the container network namespace, never the host sysctl.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 443
    ports: !override
      - "${COVEE_PUBLIC_BIND:?}:${COVEE_PUBLIC_PORT:-443}:443/tcp"
      - "127.0.0.1:${COVEE_ADMIN_PORT:-8444}:8444/tcp"
    networks:
      backend:
        aliases: ["${COVEE_CONTROL_HOST:?}"]
      edge: {}

  identity:
    image: ${COVEE_IDENTITY_IMAGE:-covee-identity:portable-local}
    environment:
      COVEE_IDENTITY_CONFIG: /etc/covee/identity.json
    user: "${COVEE_UID:?}:${COVEE_GID:?}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    pids_limit: 128
    cpus: 1.0
    mem_limit: 256m
    memswap_limit: 256m
    stop_grace_period: 20s
    networks: [backend, identity-egress]
    healthcheck:
      test: [CMD, /covee-identity, --config, /etc/covee/identity.json, --health]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ulimits:
      nofile: {soft: 4096, hard: 4096}
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    tmpfs:
      - "/tmp:rw,nosuid,nodev,noexec,size=16m,mode=0700,uid=${COVEE_UID:?},gid=${COVEE_GID:?}"
    volumes:
      - type: bind
        source: ${COVEE_DEPLOY_DIR:?}/identity.json
        target: /etc/covee/identity.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${COVEE_DEPLOY_DIR:?}/identity-internal.crt
        target: /run/covee/identity-internal.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${COVEE_DEPLOY_DIR:?}/identity-internal.key
        target: /run/covee/identity-internal.key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${COVEE_DEPLOY_DIR:?}/secrets/identity-signing-key
        target: /run/secrets/identity-signing-key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${COVEE_DEPLOY_DIR:?}/secrets/oidc-client-secret
        target: /run/secrets/oidc-client-secret
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${COVEE_DEPLOY_DIR:?}/secrets/entra-client-secret
        target: /run/secrets/entra-client-secret
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${COVEE_DEPLOY_DIR:?}/identity-secrets
        target: /run/identity-secrets
        read_only: true
        bind: {create_host_path: false}
      # Local Covee accounts: the only writable path of the broker.
      - type: bind
        source: ${COVEE_DEPLOY_DIR:?}/state/identity
        target: /var/lib/covee-identity
        bind: {create_host_path: false}

networks:
  identity-egress: {}
