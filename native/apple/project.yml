name: Covee
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: '15.0'
    iOS: '18.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '0.1.0'
    # Quoted: unquoted, a JSON round trip of this spec turned it into YES.
    CURRENT_PROJECT_VERSION: '1'
    # '-development' selects the entitlements for archiving with development signing
    # (scripts/apple_release.py); empty means the final Developer ID entitlements.
    COVEE_ENTITLEMENTS_VARIANT: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: targeted
# Terminal (SwiftTerm), SSH (Apple's swift-nio-ssh) and, on iPhone and iPad,
# screen sharing (RoyalVNCKit, archived upstream: a copy in Vendor/RoyalVNC).
# Only the apps use them, never the network extensions.
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.19.0
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh
    exactVersion: 0.15.0
  swift-nio:
    url: https://github.com/apple/swift-nio
    minorVersion: 2.104.0
  RoyalVNC:
    path: Vendor/RoyalVNC
targets:
  Covee-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
        includes: ['*.swift']
      - path: Shared
        includes: ['*.swift']
      - path: Remote
        includes: ['*.swift']
        excludes: ['ScreenShare/**']
      - path: App/Acknowledgements.txt
        buildPhase: resources
      - path: App/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.covee.macos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_MODULE_NAME: CoveeMacOS
        PRODUCT_NAME: Covee
        INFOPLIST_FILE: Config/macOS-App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/macOS-App$(COVEE_ENTITLEMENTS_VARIANT).entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: Covee-macOS-Tunnel
        embed: true
        link: false
      - sdk: NetworkExtension.framework
      - sdk: SystemExtensions.framework
      - package: SwiftTerm
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
  Covee-macOS-Tunnel:
    type: system-extension
    platform: macOS
    sources:
      - path: PacketTunnel
        includes: ['*.swift']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.covee.macos.tunnel
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: CoveeMacOSTunnel
        INFOPLIST_FILE: Config/macOS-Tunnel-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/macOS-Tunnel$(COVEE_ENTITLEMENTS_VARIANT).entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../engine/include/CoveeEngine.h
        OTHER_LDFLAGS: ['$(inherited)', '$(SRCROOT)/../../.cache/covee/apple/engine/libcovee-macos.a', '-lresolv']
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
      - sdk: IOKit.framework
  Covee-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
        includes: ['*.swift']
      - path: Shared
        includes: ['*.swift']
      - path: Remote
        includes: ['**/*.swift']
      - path: App/Acknowledgements.txt
        buildPhase: resources
      - path: App/Assets.xcassets
      # Required by the App Store: the reasons for the system calls Covee makes.
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.covee.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_MODULE_NAME: CoveeIOS
        PRODUCT_NAME: Covee
        INFOPLIST_FILE: Config/iOS-App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iOS-App.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: Covee-iOS-Tunnel
        embed: true
        link: false
      - sdk: NetworkExtension.framework
      - package: SwiftTerm
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: RoyalVNC
        product: RoyalVNCKit
  Covee-iOS-Tunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        includes: ['*.swift']
        excludes: ['main.swift']
      - path: PacketTunnel/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.covee.ios.tunnel
        PRODUCT_MODULE_NAME: CoveeIOSTunnel
        INFOPLIST_FILE: Config/iOS-Tunnel-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iOS-Tunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../engine/include/CoveeEngine.h
        'OTHER_LDFLAGS[sdk=iphoneos*]': ['$(inherited)', '$(SRCROOT)/../../.cache/covee/apple/engine/libcovee-ios.a', '-lresolv']
        'OTHER_LDFLAGS[sdk=iphonesimulator*]': ['$(inherited)', '$(SRCROOT)/../../.cache/covee/apple/engine/libcovee-ios-simulator.a', '-lresolv']
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
  Covee-macOS-Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared/ClientConfiguration.swift
      - Shared/ProviderStatus.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.covee.macos.tests
        GENERATE_INFOPLIST_FILE: YES
  Covee-iOS-Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared/ClientConfiguration.swift
      - Shared/ProviderStatus.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.covee.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  CoveePacketTunnelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PacketTunnelTests
      - PacketTunnel/AppMessage.swift
      - PacketTunnel/ConnectionHistory.swift
      - PacketTunnel/NetworkSettings.swift
      - PacketTunnel/NetworkSettingsApplier.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.covee.packettunnel.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: NetworkExtension.framework
  CoveeRemoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - RemoteTests
      - Remote/SSHShell.swift
      - Remote/SSHIdentity.swift
      - Remote/RemoteAccessStore.swift
      - Remote/RemoteTarget.swift
      - Shared/ProviderStatus.swift
      - Shared/ClientConfiguration.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.covee.remote.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
schemes:
  Covee-macOS:
    build:
      targets:
        Covee-macOS: all
    test:
      targets: [Covee-macOS-Tests]
  Covee-iOS:
    build:
      targets:
        Covee-iOS: all
    test:
      targets: [Covee-iOS-Tests]
  CoveePacketTunnelTests:
    build:
      targets:
        CoveePacketTunnelTests: all
    test:
      targets: [CoveePacketTunnelTests]
  CoveeCoreTests:
    build:
      targets:
        Covee-macOS-Tests: all
    test:
      targets: [Covee-macOS-Tests]
  CoveeIOSCoreTests:
    build:
      targets:
        Covee-iOS-Tests: all
    test:
      targets: [Covee-iOS-Tests]
  CoveeRemoteTests:
    build:
      targets:
        CoveeRemoteTests: all
    test:
      targets: [CoveeRemoteTests]
